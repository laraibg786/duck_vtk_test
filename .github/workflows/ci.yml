name: CI

# Three layers, cheapest first:
#
#   1. quick        — fast feedback on every push, using the distro's packaged VTK.
#   2. cold-boot    — Docker build from a CLONE with none of a developer's state.
#   3. distribution — the ACTUAL DuckDB community-extensions pipeline, by calling
#                     their reusable workflow with the same inputs they use.
#
# Layer 3 is the one that matters for submission. Running it here means a green CI
# on this repo implies a green build in community-extensions, rather than us
# guessing. It also builds VTK from source through our vtk-minimal vcpkg overlay
# port, which is the part most likely to break and the part nothing else exercises.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast feedback: compiler matrix (g++/clang), the LTS line, the version shim,
  #    invariants, corpus integrity and smoke — with VTK cached between runs.
  #
  #    This job used to build against the distro's libvtk9-dev to prove we were not
  #    tied to VTK 9.6. That claim turned out to be false: Ubuntu 24.04's VTK 9.1
  #    silently returns empty meshes for XML files with an <AppendedData> section,
  #    so the job was passing while exercising a broken VTK. We are now honestly
  #    pinned to VTK >= 9.6 and this builds it from source.
  # ---------------------------------------------------------------------------
  quick:
    name: quick (${{ matrix.duckdb_tag }} / ${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - duckdb_tag: v1.5.5
            duckdb_sha: d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
            citools_sha: 72e76e99cd7fee45a99739cd118ec2db64e034ec
            cc: gcc-14
            cxx: g++-14
          # The Andium/LTS line. Keeping this green is what caught a CREATE INDEX
          # crash that 1.5.x masks.
          - duckdb_tag: v1.4.5
            duckdb_sha: f31be57c1845a8895169fd58142040be26d433cf
            citools_sha: 1f04702aae6f4e7ab45f38689fd79e765221b19e
            cc: gcc-14
            cxx: g++-14
          - duckdb_tag: v1.5.5
            duckdb_sha: d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
            citools_sha: 72e76e99cd7fee45a99739cd118ec2db64e034ec
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DUCKDB_VERSION_TAG: ${{ matrix.duckdb_tag }}
      DUCKDB_SHA: ${{ matrix.duckdb_sha }}
      CITOOLS_SHA: ${{ matrix.citools_sha }}
    steps:
      - uses: actions/checkout@v4
        # NOT recursive, on purpose: this exercises scripts/bootstrap_deps.sh, so a
        # plain clone is proven to build.
        with:
          submodules: false

      - name: Install deps
        # Deliberately NOT libvtk9-dev. Ubuntu 24.04 ships VTK 9.1, which cannot
        # read XML files containing an <AppendedData> section: it fails to parse
        # them, reports GetErrorCode() == Success anyway, and returns an empty
        # mesh. This job used to run against it and passed for months while
        # silently exercising a broken VTK; see cmake/DuckVTKFindVTK.cmake.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache ${{ matrix.cc }}

      # Cache the built VTK tree, not just ccache. The first run pays ~15 minutes;
      # every later run restores it in seconds, which is what keeps this job quick.
      # Keyed on the build script so changing the module set rebuilds.
      - name: Cache minimal VTK
        id: vtk-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/vtk-9.6.2
          key: vtk-9.6.2-${{ runner.os }}-${{ hashFiles('scripts/build_minimal_vtk.sh') }}

      # Run unconditionally, cache hit or not: the script is idempotent and returns
      # immediately when VTK is already installed. Its last stdout line is the cmake
      # config directory in both cases, so take VTK_DIR from there rather than
      # duplicating the version and path here — a VTK bump would otherwise need edits
      # in two places, and the stale one would only show up as a configure failure.
      - name: Build minimal VTK (no-op on cache hit) and export VTK_DIR
        run: echo "VTK_DIR=$(./scripts/build_minimal_vtk.sh | tail -1)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-quick-${{ matrix.duckdb_tag }}-${{ matrix.cxx }}-${{ github.sha }}
          restore-keys: ccache-quick-${{ matrix.duckdb_tag }}-${{ matrix.cxx }}-

      - name: Build (bootstrap fetches duckdb itself)
        run: make release

      - name: Corpus integrity
        # Block scalar: the inline form would break YAML parsing on the ": " inside
        # the grep pattern.
        run: |
          cd test/data && sha256sum -c MANIFEST.sha256 | { grep -v ': OK$' || true; }

      - name: Version shim (2x2 compile matrix)
        run: make check-api-compat

      - name: sqllogictest
        run: make test

      - name: SQL invariants
        run: ./scripts/run_invariants.sh

      - name: Smoke
        run: BUILD_MODE=release ./scripts/smoke.sh

  # ---------------------------------------------------------------------------
  # 2. Cold boot: no preinstalled VTK, no warm cache, repo cloned not copied.
  # ---------------------------------------------------------------------------
  cold-boot:
    name: cold boot (Docker, VTK from source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Cold-boot build and test
        # No git mirror here, deliberately. `make ci-verify` mounts populated local
        # submodules as mirrors to save a ~500 MB fetch on a developer's machine, and
        # it silently did so in CI too — the run log said "network fetch NOT
        # exercised", which is precisely what this job exists to exercise. Runner
        # bandwidth is free, so take the real fetch from GitHub.
        env:
          CI_VERIFY_NO_MIRROR: 1
        run: make ci-verify

  # ---------------------------------------------------------------------------
  # 3. The real community-extensions pipeline.
  # ---------------------------------------------------------------------------
  # Calls the SAME reusable workflow community-extensions calls, with the same
  # ci_tools_version and vcpkg pin. VTK is built from source by our vtk-minimal
  # overlay port, so this is the slow job — but it is the only one that proves the
  # submission will build. exclude_archs must stay in step with
  # community-extension/description.yml.
  distribution:
    name: community-extensions build (${{ matrix.duckdb_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - duckdb_version: v1.5.5
            ci_tools_version: v1.5-variegata
            vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
          - duckdb_version: v1.4.5
            ci_tools_version: v1.4-andium
            vcpkg_commit: ce613c41372b23b1f51333815feb3edd87ef8a8b
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      extension_name: vtk
      duckdb_version: ${{ matrix.duckdb_version }}
      ci_tools_version: ${{ matrix.ci_tools_version }}
      # See docs/CI_NOTES.md §1-2: musl is opt-in on v1.5 but not on v1.4-andium,
      # so it must be excluded by name or the LTS line builds it regardless.
      #
      # windows_amd64_mingw: DuckDB's own tools/sqlite3_api_wrapper does not compile
      # under rtools42 mingw (std::byte vs. windows.h `byte`). See the fuller note in
      # community-extension/description.yml, which this must stay in step with.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;linux_arm64_musl;windows_amd64_mingw"
      vcpkg_commit: ${{ matrix.vcpkg_commit }}

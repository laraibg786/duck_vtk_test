name: CI

# Three layers, cheapest first:
#
#   1. quick        — fast feedback on every push, using the distro's packaged VTK.
#   2. cold-boot    — Docker build from a CLONE with none of a developer's state.
#   3. distribution — the ACTUAL DuckDB community-extensions pipeline, by calling
#                     their reusable workflow with the same inputs they use.
#
# Layer 3 is the one that matters for submission. Running it here means a green CI
# on this repo implies a green build in community-extensions, rather than us
# guessing. It also builds VTK from source through our vtk-minimal vcpkg overlay
# port, which is the part most likely to break and the part nothing else exercises.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Nothing here writes to the repo: no releases, no comments, no
# package pushes. actions/upload-artifact inside the reusable workflow uses its own
# token and is unaffected. Without this block every job would run with whatever the
# repository default is, which on many repos is still read-write on contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast feedback: compiler matrix (g++/clang), the LTS line, the version shim,
  #    invariants, corpus integrity and smoke — with VTK cached between runs.
  #
  #    This job used to build against the distro's libvtk9-dev to prove we were not
  #    tied to VTK 9.6. That claim turned out to be false: Ubuntu 24.04's VTK 9.1
  #    silently returns empty meshes for XML files with an <AppendedData> section,
  #    so the job was passing while exercising a broken VTK. We are now honestly
  #    pinned to VTK >= 9.6 and this builds it from source.
  # ---------------------------------------------------------------------------
  quick:
    name: quick (${{ matrix.duckdb_tag }} / ${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    # A cold VTK cache makes this ~25 min; the default job limit is 6 HOURS. The
    # public vcpkg binary cache is read-only for us (docs/CI_NOTES.md §7), so VTK is
    # built from source far more often than one would like, and a hung build is a
    # realistic failure mode worth bounding.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - duckdb_tag: v1.5.5
            duckdb_sha: d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
            citools_sha: 72e76e99cd7fee45a99739cd118ec2db64e034ec
            cc: gcc-14
            cxx: g++-14
          # The Andium/LTS line. Keeping this green is what caught a CREATE INDEX
          # crash that 1.5.x masks.
          - duckdb_tag: v1.4.5
            duckdb_sha: f31be57c1845a8895169fd58142040be26d433cf
            citools_sha: 1f04702aae6f4e7ab45f38689fd79e765221b19e
            cc: gcc-14
            cxx: g++-14
          - duckdb_tag: v1.5.5
            duckdb_sha: d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
            citools_sha: 72e76e99cd7fee45a99739cd118ec2db64e034ec
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DUCKDB_VERSION_TAG: ${{ matrix.duckdb_tag }}
      DUCKDB_SHA: ${{ matrix.duckdb_sha }}
      CITOOLS_SHA: ${{ matrix.citools_sha }}
    steps:
      - uses: actions/checkout@v4
        # NOT recursive, on purpose: this exercises scripts/bootstrap_deps.sh, so a
        # plain clone is proven to build.
        with:
          submodules: false

      - name: Install deps
        # Deliberately NOT libvtk9-dev. Ubuntu 24.04 ships VTK 9.1, which cannot
        # read XML files containing an <AppendedData> section: it fails to parse
        # them, reports GetErrorCode() == Success anyway, and returns an empty
        # mesh. This job used to run against it and passed for months while
        # silently exercising a broken VTK; see cmake/DuckVTKFindVTK.cmake.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache ${{ matrix.cc }}

      # Cache the built VTK tree, not just ccache. The first run pays ~15 minutes;
      # every later run restores it in seconds, which is what keeps this job quick.
      # Keyed on the build script so changing the module set rebuilds.
      - name: Cache minimal VTK
        id: vtk-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/vtk-9.6.2
          key: vtk-9.6.2-${{ runner.os }}-${{ hashFiles('scripts/build_minimal_vtk.sh') }}

      # Run unconditionally, cache hit or not: the script is idempotent and returns
      # immediately when VTK is already installed. It prints the cmake config
      # directory — and nothing else — on stdout, so VTK_DIR is taken from there
      # rather than duplicating the version and path here.
      #
      # The capture is its own statement under `set -e` deliberately. Written as
      # `echo "VTK_DIR=$(./scripts/build_minimal_vtk.sh)" >> $GITHUB_ENV`, a VTK
      # build that died would still leave `echo` succeeding: the step goes GREEN,
      # VTK_DIR holds whatever was printed last, and the real failure surfaces two
      # steps later as an opaque find_package error. As an assignment, `set -e`
      # aborts here, where the log is.
      - name: Build minimal VTK (no-op on cache hit) and export VTK_DIR
        run: |
          set -euo pipefail
          vtk_dir=$(./scripts/build_minimal_vtk.sh)
          echo "VTK_DIR=$vtk_dir" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-quick-${{ matrix.duckdb_tag }}-${{ matrix.cxx }}-${{ github.sha }}
          restore-keys: ccache-quick-${{ matrix.duckdb_tag }}-${{ matrix.cxx }}-

      - name: Build (bootstrap fetches duckdb itself)
        run: make release

      # DuckDB's own CodeQuality workflow pins clang_format==11.0.1, and different
      # clang-format versions disagree materially, so the version is pinned here too.
      # This checks only src/ with the repo's .clang-format (a symlink into the duckdb
      # submodule), rather than going through duckdb's format.py, which additionally
      # requires black and cmake-format to lint files we do not own.
      - name: Formatting (clang-format 11.0.1, the version DuckDB pins)
        run: |
          set -euo pipefail
          pipx install clang-format==11.0.1 2>/dev/null || pip install --user --quiet clang_format==11.0.1
          fail=0
          for f in src/*.cpp src/*/*.cpp src/include/*.hpp src/include/*/*.hpp; do
            [ -f "$f" ] || continue
            if ! clang-format --sort-includes=0 -style=file "$f" | diff -u "$f" - ; then fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::run 'make format-fix' (or clang-format -i) and commit"; exit 1; }

      - name: Corpus integrity
        # `sha256sum -c` exits 1 on a mismatch, and that status must reach the step.
        # This used to pipe into `{ grep -v ": OK$" || true; }`, which discarded the
        # status outright: a corrupted corpus produced a GREEN step. --quiet prints
        # only the FAILED lines, so the filtering it was doing is unnecessary.
        run: cd test/data && sha256sum -c --quiet MANIFEST.sha256

      - name: Version shim (2x2 compile matrix)
        run: make check-api-compat

      - name: sqllogictest
        run: make test

      - name: SQL invariants
        run: ./scripts/run_invariants.sh

      # The in-memory parse path is what every remote (https/s3/...) read uses. It is
      # otherwise reachable only with a filesystem extension loaded, so nothing in CI
      # exercised it and test/sql/remote.test was the permanently-skipped test in
      # every run. DUCK_VTK_FORCE_MEMORY_READ reroutes local reads through it, which
      # makes the whole corpus a test of that path.
      - name: In-memory parse path (the route remote files take)
        run: make test-memory-reads

      - name: Smoke
        run: BUILD_MODE=release ./scripts/smoke.sh

  # ---------------------------------------------------------------------------
  # 2. Cold boot: no preinstalled VTK, no warm cache, repo cloned not copied.
  # ---------------------------------------------------------------------------
  cold-boot:
    name: cold boot (Docker, VTK from source)
    runs-on: ubuntu-24.04
    # Builds VTK and DuckDB from scratch with no cache at all; ~40 min is normal.
    # NOTE: the `distribution` job below cannot carry a timeout — GitHub does not
    # allow `timeout-minutes` on a job that is a `uses:` call — so its bound lives
    # upstream in extension-ci-tools.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Cold-boot build and test
        # No git mirror here, deliberately. `make ci-verify` mounts populated local
        # submodules as mirrors to save a ~500 MB fetch on a developer's machine, and
        # it silently did so in CI too — the run log said "network fetch NOT
        # exercised", which is precisely what this job exists to exercise. Runner
        # bandwidth is free, so take the real fetch from GitHub.
        env:
          CI_VERIFY_NO_MIRROR: 1
        run: make ci-verify

  # ---------------------------------------------------------------------------
  # 3. The real community-extensions pipeline.
  # ---------------------------------------------------------------------------
  # Calls the SAME reusable workflow community-extensions calls, with the same
  # ci_tools_version and vcpkg pin. VTK is built from source by our vtk-minimal
  # overlay port, so this is the slow job — but it is the only one that proves the
  # submission will build. exclude_archs must stay in step with
  # community-extension/description.yml.
  distribution:
    name: community-extensions build (${{ matrix.duckdb_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The DEFAULT line. This entry's exclude_archs is the submission-relevant
          # one and must stay identical to excluded_platforms in
          # community-extension/description.yml — scripts/submit_check.sh enforces it.
          #
          # See docs/CI_NOTES.md §1-2: musl is opt-in on v1.5 but not on v1.4-andium,
          # so it must be excluded by name or the LTS line builds it regardless.
          # windows_amd64_mingw: DuckDB's own tools/sqlite3_api_wrapper does not
          # compile under rtools42 mingw; see description.yml for the full note.
          - duckdb_version: v1.5.5
            ci_tools_version: v1.5-variegata
            vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
            exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;linux_arm64_musl;windows_amd64_mingw"
          # The Andium/LTS line, which additionally excludes windows_amd64.
          #
          # Same upstream file, different compiler: DuckDB v1.4.5's
          # tools/sqlite3_api_wrapper/sqlite3_api_wrapper.cpp does not compile under
          # the current MSVC 14.51 + Windows SDK 10.0.26100 either —
          #   objidl.h: error C2872: 'byte': ambiguous symbol
          #     could be 'unsigned char byte' (rpcndr.h) or 'std::byte' (cstddef)
          # v1.5.5 compiles the same file fine, so this is fixed upstream on the
          # default line. Our own extension is NOT implicated: the log shows
          # `Linking CXX static library extension\vtk\vtk_extension.lib` succeeding
          # at step 361/456, immediately before DuckDB's tool fails at 362.
          #
          # This costs nothing at submission time: community-extensions'
          # build_andium.yml is `if: false`, so the LTS line is not built for a
          # submission PR at all. Excluding it here keeps our own CI honestly green
          # instead of permanently red for someone else's bug.
          - duckdb_version: v1.4.5
            ci_tools_version: v1.4-andium
            vcpkg_commit: ce613c41372b23b1f51333815feb3edd87ef8a8b
            exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;linux_arm64_musl;windows_amd64_mingw;windows_amd64"
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      extension_name: vtk
      duckdb_version: ${{ matrix.duckdb_version }}
      ci_tools_version: ${{ matrix.ci_tools_version }}
      exclude_archs: ${{ matrix.exclude_archs }}
      vcpkg_commit: ${{ matrix.vcpkg_commit }}
